name: Run botli

on:
  workflow_dispatch:
    inputs:
      upgrade:
        description: "Upgrade to a Lichess bot account?"
        required: false
        type: boolean
        default: false
      matchmaking:
        description: "Enable matchmaking?"
        required: true
        type: boolean
        default: true
      additional_command:
        description: "Optional commands to pass (wrap in quotes)"
        required: false
        default: ""
      never_stop:
        description: "Never stop matchmaking unless it stops itself"
        required: false
        type: boolean
        default: true
      stop_seconds:
        description: "Seconds to wait before sending stop command (ignored if never_stop ticked)"
        required: false
        default: ""

  push:
    branches:
      - main
    paths:
      - user_interface.py

  schedule:
    - cron: "0 */2 * * *"

# Права доступа для встроенного GITHUB_TOKEN
permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

            # =========================
      # STOCKFISH 18 (OFFICIAL)
      # =========================
      - name: Install Stockfish 18
        run: |
          set -e

          echo "Installing Stockfish 18..."
          mkdir -p engines

          STOCKFISH_URL="https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-avx2.tar"

          curl -L --fail "$STOCKFISH_URL" -o sf18.tar

          echo "Downloaded file type:"
          file sf18.tar

          echo "Checking archive..."
          tar -tf sf18.tar > /dev/null

          tar -xf sf18.tar

          chmod +x stockfish/stockfish-ubuntu-x86-64-avx2

          mv stockfish/stockfish-ubuntu-x86-64-avx2 engines/sf

          echo "Installed version:"
          ./engines/sf bench 1

           # =========================
      # FAIRY-STOCKFISH
      # =========================
      - name: Install Fairy-Stockfish
        run: |
          set -e

          echo "Installing Fairy-Stockfish..."
          mkdir -p engines

          RUN_ID=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/fairy-stockfish/Fairy-Stockfish/actions/runs?branch=master&status=success" \
            | jq -r '.workflow_runs[0].id')

          echo "Workflow Run ID: $RUN_ID"

          ARTIFACT_URL=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/fairy-stockfish/Fairy-Stockfish/actions/runs/$RUN_ID/artifacts" \
            | jq -r '.artifacts[] | select(.name | contains("linux-x86-64-modern")) | .archive_download_url' \
            | head -n 1)

          if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" = "null" ]; then
            echo "ERROR: Fairy-Stockfish artifact not found."
            exit 1
          fi

          echo "Downloading Fairy-Stockfish..."

          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$ARTIFACT_URL" \
            -o fsf.zip

          unzip -t fsf.zip

          unzip -o fsf.zip -d engines

          chmod +x engines/fairy-stockfish_x86-64-modern

          mv engines/fairy-stockfish_x86-64-modern engines/fsf

          echo "Installed Fairy-Stockfish:"
          ./engines/fsf --version || true

      - name: Inject Secret Token
        run: sed -i "s/TokenTimeIsBackBuddyss/${{ secrets.LICHESS_KEY }}/g" config.yml

      - name: Cancel previous runs
        run: |
          CURRENT_RUN_ID=${{ github.run_id }}
          RUNS=$(gh run list --workflow "Run botli" --status in_progress --json databaseId --jq ".[].databaseId" | grep -v "$CURRENT_RUN_ID" || true)
          for RUN_ID in $RUNS; do
            echo "Canceling previous run: $RUN_ID"
            gh run cancel "$RUN_ID"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Bot
        run: |
          CMD='python3 -u user_interface.py "tournament kVKuvLSY"'

          [ "${{ github.event.inputs.upgrade }}" = "true" ] && CMD="$CMD --upgrade"
          [ "${{ github.event.inputs.matchmaking }}" = "true" ] && CMD="$CMD matchmaking"

          if [ -n "${{ github.event.inputs.additional_command }}" ]; then
            CMD="$CMD ${{ github.event.inputs.additional_command }}"
          fi

          echo "Running: $CMD"
          eval "$CMD" &
          BOT_PID=$!

          if [ "${{ github.event.inputs.matchmaking }}" = "true" ] && \
             [ "${{ github.event.inputs.never_stop }}" != "true" ] && \
             [[ "${{ github.event.inputs.stop_seconds }}" =~ ^[0-9]+$ ]]; then
            sleep "${{ github.event.inputs.stop_seconds }}"
            python3 -u user_interface.py stop
          fi

          # Ожидание 350 минут до принудительной остановки
          sleep 21000
          echo "Time limit reached. Stopping bot process..."
          kill -SIGTERM $BOT_PID || true
          wait $BOT_PID
          echo "Bot stopped cleanly."
